<h2>Mis citas</h2>

<table>
  <thead>
    <tr>
      <th>Fecha y hora</th>
      <th>Medico</th>
      <th>Estado</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let cita of citas">
      <td>{{ cita.fechaHora }}</td>
      <td>{{ cita.medicoId }}</td>
      <td>{{ cita.estado }}</td>
      <td>
        <button (click)="cancelar(cita)">Cancelar</button>
      </td>
    </tr>
  </tbody>
</table>

<p *ngIf="citas.length === 0">No tiene citas registradas.</p>
