# Configuracion de la aplicacion
spring.application.name=citas-medicas
server.port=8080

# Base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/citas_medicas
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Origen permitido para el portal Angular
app.cors.origen=http://localhost:4200

# Correo de notificaciones de citas
spring.mail.host=smtp.gmail.com
spring.mail.port=587
